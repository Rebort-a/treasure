name: CI Common (Reusable)

on:
  workflow_call:

permissions:
  contents: read

jobs:
  analyze:
    name: Format, Analyze & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: subosito/flutter-action@v2
        with:
          flutter-version-file: .fvmrc
          cache: true

      - name: Cache pub dependencies
        uses: actions/cache@v6
        with:
          path: |
            ${{ env.PUB_CACHE }}
            .dart_tool/
          key: pub-${{ runner.os }}-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: pub-${{ runner.os }}-

      - run: flutter pub get
      - name: Check Dart formatting
        run: dart format --output=none --set-exit-if-changed lib test scripts
      - run: flutter analyze lib
      - run: flutter test --coverage
      - name: Check critical coverage
        run: dart run scripts/coverage_report.dart --check --json=coverage/summary.json
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: coverage
          path: |
            coverage/lcov.info
            coverage/summary.json
          retention-days: 14
      # CPU 微基准仅记录趋势，不用共享运行器上的绝对耗时阻断提交。
      - name: Record deterministic CPU benchmarks
        run: dart run scripts/benchmark.dart --json=build/quality/benchmark.json
      - name: Upload benchmark report
        uses: actions/upload-artifact@v6
        with:
          name: benchmarks
          path: build/quality/benchmark.json
          retention-days: 14

  build-web:
    name: Build Web
    needs: analyze
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: subosito/flutter-action@v2
        with:
          flutter-version-file: .fvmrc
          cache: true

      - name: Cache pub dependencies
        uses: actions/cache@v6
        with:
          path: |
            ${{ env.PUB_CACHE }}
            .dart_tool/
          key: pub-${{ runner.os }}-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: pub-${{ runner.os }}-

      - run: flutter pub get
      - run: flutter build web --release --base-href "/treasure/"

      - name: Upload web artifact
        uses: actions/upload-artifact@v6
        with:
          name: web
          path: build/web
          retention-days: 1
