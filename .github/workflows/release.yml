name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ci:
    name: Analyze, Test & Build Web
    uses: ./.github/workflows/_ci-common.yml

  build-android:
    name: Build Android
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: subosito/flutter-action@v2
        with:
          flutter-version-file: .fvmrc
          cache: true

      - name: Cache pub dependencies
        uses: actions/cache@v5
        with:
          path: |
            ${{ env.PUB_CACHE }}
            .dart_tool/
          key: pub-${{ runner.os }}-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: pub-${{ runner.os }}-

      - name: Cache Gradle
        uses: actions/cache@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/gradle-wrapper.properties', '**/*.gradle.kts') }}
          restore-keys: gradle-${{ runner.os }}-

      - run: flutter pub get
      # 产物用 debug 签名（build.gradle.kts 用 signingConfigs.debug），仅供测试，不可上架 Play Store
      - run: flutter build apk --release

      - name: Upload Android artifact
        uses: actions/upload-artifact@v5
        with:
          name: android
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30

  build-linux:
    name: Build Linux
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y ninja-build libgtk-3-dev

      - uses: subosito/flutter-action@v2
        with:
          flutter-version-file: .fvmrc
          cache: true

      - name: Cache pub dependencies
        uses: actions/cache@v5
        with:
          path: |
            ${{ env.PUB_CACHE }}
            .dart_tool/
          key: pub-${{ runner.os }}-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: pub-${{ runner.os }}-

      - run: flutter pub get
      - run: flutter build linux --release

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v5
        with:
          name: linux
          path: build/linux/x64/release/bundle/
          retention-days: 30

  build-windows:
    name: Build Windows
    needs: ci
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: subosito/flutter-action@v2
        with:
          flutter-version-file: .fvmrc
          cache: true

      - name: Cache pub dependencies
        uses: actions/cache@v5
        with:
          path: |
            ${{ env.PUB_CACHE }}
            .dart_tool/
          key: pub-${{ runner.os }}-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: pub-${{ runner.os }}-

      - run: flutter pub get
      - run: flutter build windows --release

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v5
        with:
          name: windows
          path: build/windows/x64/runner/Release/
          retention-days: 30

  build-macos:
    name: Build macOS
    needs: ci
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      - uses: subosito/flutter-action@v2
        with:
          flutter-version-file: .fvmrc
          cache: true

      - name: Cache pub dependencies
        uses: actions/cache@v5
        with:
          path: |
            ${{ env.PUB_CACHE }}
            .dart_tool/
          key: pub-${{ runner.os }}-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: pub-${{ runner.os }}-

      - run: flutter pub get
      - run: flutter build macos --release

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v5
        with:
          name: macos
          path: build/macos/Build/Products/Release/
          retention-days: 30

  build-ios:
    name: Build iOS
    needs: ci
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      - uses: subosito/flutter-action@v2
        with:
          flutter-version-file: .fvmrc
          cache: true

      - name: Cache pub dependencies
        uses: actions/cache@v5
        with:
          path: |
            ${{ env.PUB_CACHE }}
            .dart_tool/
          key: pub-${{ runner.os }}-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: pub-${{ runner.os }}-

      - run: flutter pub get
      # 未配置 Apple 证书，--no-codesign 仅产出未签名 Runner.app，不可直接安装到设备
      - run: flutter build ios --release --no-codesign

      - name: Upload iOS artifact
        uses: actions/upload-artifact@v5
        with:
          name: ios
          path: build/ios/iphoneos/Runner.app
          retention-days: 30

  release:
    name: Create Release
    needs: [ci, build-android, build-linux, build-windows, build-macos, build-ios]
    runs-on: ubuntu-latest
    environment:
      name: production
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Get version from tag
        id: version
        run: echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"

      - name: Extract release notes
        run: |
          git log -1 --pretty=format:'%B' | awk '/^## Release Notes$/{f=1;next} /^## End Notes$/{f=0} f' > release_notes.md
          echo "----- release_notes.md -----"
          cat release_notes.md

      - name: Download all artifacts
        uses: actions/download-artifact@v5
        with:
          path: artifacts

      - name: Package artifacts
        env:
          VERSION: ${{ steps.version.outputs.tag }}
        run: |
          cd artifacts

          # Web → zip（来自 _ci-common.yml 的 web artifact）
          cd web && zip -r "../../treasure-web-${VERSION}.zip" . && cd ..

          # Android → rename
          mv android/app-release.apk "../treasure-android-${VERSION}.apk"

          # Linux → tar
          tar czf "../treasure-linux-${VERSION}.tar.gz" -C linux .

          # Windows → zip
          cd windows && zip -r "../../treasure-windows-${VERSION}.zip" . && cd ..

          # macOS → tar
          tar czf "../treasure-macos-${VERSION}.tar.gz" -C macos .

          # iOS → zip
          cd ios && zip -r "../../treasure-ios-${VERSION}.zip" . && cd ..

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          body_path: release_notes.md
          files: |
            treasure-web-${{ steps.version.outputs.tag }}.zip
            treasure-android-${{ steps.version.outputs.tag }}.apk
            treasure-linux-${{ steps.version.outputs.tag }}.tar.gz
            treasure-windows-${{ steps.version.outputs.tag }}.zip
            treasure-macos-${{ steps.version.outputs.tag }}.tar.gz
            treasure-ios-${{ steps.version.outputs.tag }}.zip
  # Deploy to GitHub Pages 已迁移至 flutter.yml：
  # release 提交仅改版本号（空提交），web 产物无变化，无需部署 Pages；
  # Pages 由普通提交（push main）在 flutter.yml 中部署。
