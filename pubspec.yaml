name: treasure
description: "A cross-platform multiplayer game collection. 11 local games + 5 LAN games + 1 chat room. Pure Dart, zero dependencies."
publishing_to: 'none'

version: 1.0.0+2

topics:
  - game
  - multiplayer
  - minecraft
  - lan
  - voxel

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  web_socket_channel: ^3.0.3
  http: ^1.6.0
  image_picker: ^1.2.2
  file_picker: ^11.0.2
  path_provider: ^2.1.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  assets:
    - assets/images/
  uses-material-design: true