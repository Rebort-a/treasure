name: treasure
description: "A Flutter game lab: 16 games and LAN chat, self-built Dart game cores, voxel rendering, and multiplayer synchronization."
publishing_to: 'none'

version: 1.3.1+9

topics:
  - game
  - multiplayer
  - minecraft
  - lan
  - voxel

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.3
  web_socket_channel: ^3.0.3
  image_picker: ^1.2.3
  file_picker: ">=12.1.2 <14.0.0"
  path_provider: ^2.1.5
  package_info_plus: ^10.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  generate: true
  assets:
    - assets/images/
  uses-material-design: true
