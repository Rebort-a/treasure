name: treasure
description: "A cross-platform game collection: 14 local games (5 with LAN multiplayer) + 1 LAN chat room. Pure-Dart 3D engine, zero-config LAN play."
publishing_to: 'none'

version: 1.2.1+6

topics:
  - game
  - multiplayer
  - minecraft
  - lan
  - voxel

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.3
  web_socket_channel: ^3.0.3
  http: ^1.6.0
  image_picker: ^1.2.3
  file_picker: ^12.1.2
  path_provider: ^2.1.5
  package_info_plus: ^10.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  generate: true
  assets:
    - assets/images/
  uses-material-design: true