name: treasure
description: "A Flutter game lab: 16 games and LAN chat, self-built Dart game cores, voxel rendering, and multiplayer synchronization."
publish_to: 'none'

version: 1.3.4+12

topics:
  - game
  - multiplayer
  - minecraft
  - lan
  - voxel

environment:
  sdk: ^3.14.0
  flutter: '>=3.50.1'

dependencies:
  flutter:
    sdk: flutter
  material_ui: ^1.11.1
  intl: ^0.20.3
  web_socket_channel: ^3.0.3
  image_picker: ^1.2.3
  file_picker: ^13.4.1
  path_provider: ^2.1.5
  package_info_plus: ^10.2.1
  audioplayers: ^6.8.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  assets:
    - assets/images/
    - assets/audio/effects/
    - assets/audio/music/
    - assets/audio/voice/
  uses-material-design: true
